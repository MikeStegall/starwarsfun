server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json font/woff font/woff2;

    # Cache hashed static assets aggressively
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: let React Router handle client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
